# Local stack: PostgreSQL 16 + the API. `docker compose up --build`, then
# http://localhost:8080/swagger-ui.html. Credentials are local-development defaults only.
name: seatlock
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seats
      POSTGRES_USER: seats
      POSTGRES_PASSWORD: seats
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seats -d seats"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: seatlock:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/seats
      DB_USER: seats
      DB_PASSWORD: seats
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
