spring:
  application:
    name: seatlock
  # No defaults on purpose: a deployment without DB_* fails at startup instead of silently using
  # development credentials. `--spring.profiles.active=local` supplies them (application-local.yml).
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false # ApiExceptionHandler renders problem+json itself

server:
  port: ${PORT:8080}
  shutdown: graceful

seats:
  hold-ttl: PT5M
  max-seats-per-hold: 10
  expiry-batch-size: 100
  expiry-sweep-interval: PT5S
  idempotency-retention: PT24H

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
