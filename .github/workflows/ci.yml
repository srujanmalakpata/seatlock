name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Lint (google-java-format via Spotless)
        run: ./mvnw -B -ntp spotless:check

      # Unit + MockMvc tests (Surefire) and Testcontainers PostgreSQL integration tests
      # (Failsafe). Docker is available on ubuntu-latest runners.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: warn

  docker:
    name: Docker image and smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build image and start app + PostgreSQL
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Smoke test
        run: ./scripts/smoke-test.sh http://localhost:8080

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes
